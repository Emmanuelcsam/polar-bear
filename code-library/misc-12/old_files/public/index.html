<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Core Detection Orchestrator Monitor</title>
    <script src="/socket.io/socket.io.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            color: #333;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }

        .header {
            text-align: center;
            margin-bottom: 30px;
            color: white;
        }

        .header h1 {
            font-size: 2.5rem;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }

        .header p {
            font-size: 1.1rem;
            opacity: 0.9;
        }

        .control-panel {
            background: white;
            border-radius: 15px;
            padding: 25px;
            margin-bottom: 30px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }

        .control-buttons {
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
            justify-content: center;
        }

        .btn {
            padding: 12px 24px;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .btn-primary {
            background: linear-gradient(45deg, #4CAF50, #45a049);
            color: white;
        }

        .btn-primary:hover {
            background: linear-gradient(45deg, #45a049, #4CAF50);
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(76, 175, 80, 0.4);
        }

        .btn-danger {
            background: linear-gradient(45deg, #f44336, #d32f2f);
            color: white;
        }

        .btn-danger:hover {
            background: linear-gradient(45deg, #d32f2f, #f44336);
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(244, 67, 54, 0.4);
        }

        .btn-warning {
            background: linear-gradient(45deg, #ff9800, #f57c00);
            color: white;
        }

        .btn-warning:hover {
            background: linear-gradient(45deg, #f57c00, #ff9800);
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(255, 152, 0, 0.4);
        }

        .status-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(350px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .process-card {
            background: white;
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.1);
            transition: all 0.3s ease;
        }

        .process-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 30px rgba(0,0,0,0.15);
        }

        .process-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }

        .process-name {
            font-size: 1.2rem;
            font-weight: 600;
            color: #333;
        }

        .status-indicator {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            display: inline-block;
            margin-left: 10px;
        }

        .status-running {
            background: #4CAF50;
            box-shadow: 0 0 10px rgba(76, 175, 80, 0.5);
        }

        .status-stopped {
            background: #f44336;
        }

        .status-unknown {
            background: #9e9e9e;
        }

        .process-info {
            margin-bottom: 15px;
        }

        .info-row {
            display: flex;
            justify-content: space-between;
            margin-bottom: 5px;
            font-size: 0.9rem;
        }

        .info-label {
            color: #666;
            font-weight: 500;
        }

        .info-value {
            color: #333;
            font-weight: 600;
        }

        .output-container {
            background: #f5f5f5;
            border-radius: 8px;
            padding: 15px;
            max-height: 200px;
            overflow-y: auto;
            font-family: 'Courier New', monospace;
            font-size: 0.85rem;
            line-height: 1.4;
        }

        .output-content {
            white-space: pre-wrap;
            word-wrap: break-word;
        }

        .connection-status {
            position: fixed;
            top: 20px;
            right: 20px;
            padding: 10px 15px;
            border-radius: 25px;
            font-weight: 600;
            font-size: 0.9rem;
            z-index: 1000;
        }

        .connected {
            background: #4CAF50;
            color: white;
        }

        .disconnected {
            background: #f44336;
            color: white;
        }

        .loading {
            background: #ff9800;
            color: white;
        }

        .notification {
            position: fixed;
            top: 80px;
            right: 20px;
            padding: 15px 20px;
            border-radius: 8px;
            color: white;
            font-weight: 600;
            z-index: 1000;
            transform: translateX(400px);
            transition: transform 0.3s ease;
        }

        .notification.show {
            transform: translateX(0);
        }

        .notification.success {
            background: #4CAF50;
        }

        .notification.error {
            background: #f44336;
        }

        .notification.warning {
            background: #ff9800;
        }

        @media (max-width: 768px) {
            .container {
                padding: 10px;
            }

            .header h1 {
                font-size: 2rem;
            }

            .control-buttons {
                flex-direction: column;
            }

            .status-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="connection-status" id="connectionStatus">
        Connecting...
    </div>

    <div class="notification" id="notification"></div>

    <div class="container">
        <div class="header">
            <h1>🔧 Core Detection Orchestrator</h1>
            <p>Monitor and control parallel Python processes in real-time</p>
        </div>

        <div class="control-panel">
            <h2 style="text-align: center; margin-bottom: 20px; color: #333;">Control Panel</h2>
            <div class="control-buttons">
                <button class="btn btn-primary" onclick="startAllProcesses()">
                    🚀 Start All Processes
                </button>
                <button class="btn btn-danger" onclick="stopAllProcesses()">
                    🛑 Stop All Processes
                </button>
                <button class="btn btn-warning" onclick="refreshStatus()">
                    🔄 Refresh Status
                </button>
            </div>
        </div>

        <div class="status-grid" id="statusGrid">
            <!-- Process cards will be dynamically generated here -->
        </div>
    </div>

    <script>
        const socket = io();
        let currentStatus = {};

        // Connection status handling
        socket.on('connect', () => {
            updateConnectionStatus('connected', 'Connected');
        });

        socket.on('disconnect', () => {
            updateConnectionStatus('disconnected', 'Disconnected');
        });

        socket.on('connect_error', () => {
            updateConnectionStatus('disconnected', 'Connection Error');
        });

        function updateConnectionStatus(status, text) {
            const statusEl = document.getElementById('connectionStatus');
            statusEl.className = `connection-status ${status}`;
            statusEl.textContent = text;
        }

        // Status updates
        socket.on('status', (data) => {
            currentStatus = data;
            updateUI(data);
        });

        // Command results
        socket.on('commandResult', (result) => {
            showNotification(result.message, result.success ? 'success' : 'error');
        });

        function updateUI(data) {
            const statusGrid = document.getElementById('statusGrid');
            statusGrid.innerHTML = '';

            const processes = data.processes || {};
            const outputs = data.outputs || {};

            Object.keys(processes).forEach(processName => {
                const process = processes[processName];
                const output = outputs[processName] || { stdout: '', stderr: '' };
                
                const card = createProcessCard(processName, process, output);
                statusGrid.appendChild(card);
            });

            // Add overall status card
            const overallCard = createOverallStatusCard(data);
            statusGrid.insertBefore(overallCard, statusGrid.firstChild);
        }

        function createProcessCard(processName, process, output) {
            const card = document.createElement('div');
            card.className = 'process-card';

            const statusClass = process.running ? 'status-running' : 
                              process.exitCode !== null ? 'status-stopped' : 'status-unknown';
            const statusText = process.running ? 'Running' : 
                              process.exitCode !== null ? 'Stopped' : 'Unknown';

            card.innerHTML = `
                <div class="process-header">
                    <div class="process-name">
                        ${processName.replace('-', ' ').replace(/\b\w/g, l => l.toUpperCase())}
                        <span class="status-indicator ${statusClass}"></span>
                    </div>
                    <button class="btn btn-warning" onclick="restartProcess('${processName}')" 
                            style="padding: 5px 10px; font-size: 0.8rem;">
                        🔄 Restart
                    </button>
                </div>
                <div class="process-info">
                    <div class="info-row">
                        <span class="info-label">PID:</span>
                        <span class="info-value">${process.pid || 'N/A'}</span>
                    </div>
                    <div class="info-row">
                        <span class="info-label">Status:</span>
                        <span class="info-value">${statusText}</span>
                    </div>
                    <div class="info-row">
                        <span class="info-label">Exit Code:</span>
                        <span class="info-value">${process.exitCode !== null ? process.exitCode : 'N/A'}</span>
                    </div>
                </div>
                <div class="output-container">
                    <div class="output-content">${output.stdout || 'No output yet...'}</div>
                    ${output.stderr ? `<div class="output-content" style="color: #f44336; margin-top: 10px;">${output.stderr}</div>` : ''}
                </div>
            `;

            return card;
        }

        function createOverallStatusCard(data) {
            const card = document.createElement('div');
            card.className = 'process-card';
            card.style.gridColumn = '1 / -1';
            card.style.background = 'linear-gradient(135deg, #667eea 0%, #764ba2 100%)';
            card.style.color = 'white';

            const processes = data.processes || {};
            const runningCount = Object.values(processes).filter(p => p.running).length;
            const totalCount = Object.keys(processes).length;

            card.innerHTML = `
                <div class="process-header">
                    <div class="process-name" style="color: white;">System Overview</div>
                </div>
                <div class="process-info">
                    <div class="info-row">
                        <span class="info-label">Total Processes:</span>
                        <span class="info-value">${totalCount}</span>
                    </div>
                    <div class="info-row">
                        <span class="info-label">Running:</span>
                        <span class="info-value">${runningCount}</span>
                    </div>
                    <div class="info-row">
                        <span class="info-label">Stopped:</span>
                        <span class="info-value">${totalCount - runningCount}</span>
                    </div>
                    <div class="info-row">
                        <span class="info-label">System Status:</span>
                        <span class="info-value">${data.isRunning ? 'Active' : 'Inactive'}</span>
                    </div>
                </div>
            `;

            return card;
        }

        // Control functions
        function startAllProcesses() {
            socket.emit('startAll');
        }

        function stopAllProcesses() {
            socket.emit('stopAll');
        }

        function restartProcess(processName) {
            socket.emit('restartProcess', processName);
        }

        function refreshStatus() {
            socket.emit('getStatus');
        }

        function showNotification(message, type = 'success') {
            const notification = document.getElementById('notification');
            notification.textContent = message;
            notification.className = `notification ${type}`;
            
            setTimeout(() => {
                notification.classList.add('show');
            }, 100);

            setTimeout(() => {
                notification.classList.remove('show');
            }, 3000);
        }

        // Auto-refresh status every 5 seconds
        setInterval(() => {
            if (socket.connected) {
                socket.emit('getStatus');
            }
        }, 5000);

        // Initial status request
        socket.emit('getStatus');
    </script>
</body>
</html>
